services:
  - type: web
    name: ai-travel-planner-api
    runtime: python
    rootDir: travel-planner
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn --app-dir backend main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
